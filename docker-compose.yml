services:
  asset-lens:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 默认走清华 TUNA 镜像（国内快、稳）；如需官方源/其他镜像：PIP_INDEX_URL=https://pypi.org/simple docker compose build
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    image: asset-lens:latest
    container_name: asset-lens

    environment:
      - PYTHONUNBUFFERED=1
      - ASSET_LENS_ENV=production
      - TZ=Asia/Shanghai
      # 真实数据模式：数据源在 ts-demo 项目（宿主 ../ts-demo/data，挂载到容器 /app/ts-demo/data）
      - DATA_MODE=real
      - REAL_DATA_PATH=ts-demo/data

    volumes:
      - ./cache:/app/cache
      - ./data:/app/data
      - ./logs:/app/logs
      - ./reports:/app/reports
      - ./config:/app/config
      - ../ts-demo/data:/app/ts-demo/data

    # 宿主端口取 >10000 的高位端口，避开 180xx/190xx 上其他项目占用的段。
    # 容器内仍为 8000；如需改宿主端口，只改冒号左侧。
    # 仅绑定 127.0.0.1：Web API 无鉴权，避免暴露到局域网（合规/隐私）。
    ports:
      - "127.0.0.1:29080:8000"

    # 默认启动 Web API。跑 CLI：docker compose run --rm asset-lens python -m asset_lens --help
    command: ["uvicorn", "asset_lens.web.api:app", "--host", "0.0.0.0", "--port", "8000"]

    # 普通 compose 下生效的资源限制（deploy.resources 只在 swarm 模式生效）
    cpus: 2
    mem_limit: 2g

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  scheduler:
    image: asset-lens:latest
    container_name: asset-lens-scheduler
    depends_on:
      asset-lens:
        condition: service_healthy

    environment:
      - PYTHONUNBUFFERED=1
      - ASSET_LENS_ENV=production
      - TZ=Asia/Shanghai
      - DATA_MODE=real
      - REAL_DATA_PATH=ts-demo/data

    volumes:
      - ./cache:/app/cache
      - ./data:/app/data
      - ./logs:/app/logs
      - ./reports:/app/reports
      - ../ts-demo/data:/app/ts-demo/data

    # 启动后先跑一次每日任务，此后每 24 小时一次。
    # 旧配置里的 `data update-market-data` / `report generate` 子命令并不存在，
    # 改用项目自带的整合命令 run-daily-tasks。
    command: >
      sh -c "
        while true; do
          echo 'Starting daily update at '$(date)
          python -m asset_lens run-daily-tasks
          sleep 86400
        done
      "

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: asset-lens-network
